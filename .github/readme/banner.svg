  <rect x="332" y="222" width="64" height="4" rx="2" fill="#4CC2FF"/>

  <text x="330" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#6E6E73">Local &#183; No account &#183; No backend &#183; No analytics</text>
