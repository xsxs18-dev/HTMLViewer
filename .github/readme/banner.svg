<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="18%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#4CC2FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4CC2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#4CC2FF" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="iconClip">
      <rect x="0" y="0" width="220" height="220" rx="49"/>
    </clipPath>
    <filter id="iconShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <rect x="64" y="50" width="220" height="220" rx="49" fill="#4CC2FF" fill-opacity="0.12" filter="url(#iconShadow)"/>
  <g clip-path="url(#iconClip)" transform="translate(64,50)">
    <image href="data:image/png;base64," x="0" y="0" width="220" height="220"/>
  </g>
  <rect x="64.5" y="50.5" width="219" height="219" rx="48.5" fill="none" stroke="#4CC2FF" stroke-opacity="0.35" stroke-width="1"/>

  <text x="330" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF">HTMLViewer</text>
