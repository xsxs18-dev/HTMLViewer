<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glowBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glowBlurSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0C"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <clipPath id="iconClip2">
      <rect x="0" y="0" width="120" height="120" rx="27"/>
    </clipPath>
  </defs>

  <rect x="30" y="30" width="840" height="160" rx="24" fill="#4CC2FF" fill-opacity="0.55" filter="url(#glowBlurSoft)"/>
  <rect x="30" y="30" width="840" height="160" rx="24" fill="#4CC2FF" fill-opacity="0.55" filter="url(#glowBlur)"/>

  <rect x="30" y="30" width="840" height="160" rx="24" fill="url(#cardBg)" stroke="#4CC2FF" stroke-opacity="0.9" stroke-width="1.5"/>

  <g transform="translate(60,60)">
    <rect x="0" y="0" width="120" height="120" rx="27" fill="#4CC2FF" fill-opacity="0.16"/>
    <g clip-path="url(#iconClip2)">
      <image href="data:image/png;base64," x="0" y="0" width="120" height="120"/>
    </g>
    <rect x="0.5" y="0.5" width="119" height="119" rx="26.5" fill="none" stroke="#4CC2FF" stroke-opacity="0.4" stroke-width="1"/>
  </g>

  <text x="216" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#4CC2FF">ONE-TAP INSTALL</text>
  <text x="214" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF">Add to AltStore</text>
  <text x="216" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#9A9A9E">Also works with SideStore &amp; Feather</text>

  <g transform="translate(800,80)">
    <circle cx="30" cy="30" r="30" fill="#4CC2FF"/>
    <path d="M 30 16 L 30 40 M 20 30 L 30 40 L 40 30" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
